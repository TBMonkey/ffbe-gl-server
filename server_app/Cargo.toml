[package]
name = "ffbe-server-app"
version = "0.1.7"
edition = "2021"
description = "Launcher + dependency doctor for the FFBE synthetic server (engine stays Python)"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
